<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeRun Hackathon - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container mt-5">
        <h1 class="text-center mb-4">Past Projects</h1>
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <img src="https://via.placeholder.com/400x200" class="card-img-top" alt="Project 1">
                    <div class="card-body">
                        <h5 class="card-title">Booking System</h5>
                        <p class="card-text">A web application for workspace reservation built with React and Django.</p>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <img src="https://via.placeholder.com/400x200" class="card-img-top" alt="Project 2">
                    <div class="card-body">
                        <h5 class="card-title">iOS EPUB Reader</h5>
                        <p class="card-text">A Swift application for reading EPUB books with asynchronous loading.</p>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <img src="https://via.placeholder.com/400x200" class="card-img-top" alt="Project 3">
                    <div class="card-body">
                        <h5 class="card-title">Smart Home UI</h5>
                        <p class="card-text">Cross-platform interface for device management.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
