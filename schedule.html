<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="See the CodeRun Hackathon weekend schedule and filter events by type.">
    <title data-i18n="schedule.title">CodeRun Hackathon - Schedule</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top site-nav">
        <div class="container">
            <a class="navbar-brand" href="index.html">CodeRun</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" data-i18n-aria-label="nav.toggle"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="index.html" data-i18n="nav.home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html" data-i18n="nav.about">About</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="schedule.html" data-i18n="nav.schedule">Schedule</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html" data-i18n="nav.projects">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="planner.html" data-i18n="nav.planner">Team planner</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html" data-i18n="nav.contact">Contact</a></li>
                    <li class="nav-item ms-lg-3"><button class="btn btn-outline-light btn-sm" id="themeToggle" type="button" aria-pressed="false" data-i18n="theme.dark">Dark mode</button></li>
                    <li class="nav-item ms-lg-2"><button class="btn btn-outline-light btn-sm" id="languageToggle" type="button" aria-label="Change language" data-i18n-aria-label="language.accessible" data-i18n="language.switch">RU</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <header class="page-heading mb-4">
            <p class="eyebrow" data-i18n="nav.schedule">Schedule</p>
            <h1 data-i18n="schedule.title">Event schedule</h1>
            <p class="text-muted mb-0" data-i18n="schedule.lead">Filter the weekend by event type.</p>
        </header>
        <div class="row g-3 align-items-end mb-3">
            <div class="col-sm-6 col-md-4">
                <label class="form-label" for="scheduleFilter" data-i18n="schedule.filter">Show event type</label>
                <select class="form-select" id="scheduleFilter">
                    <option value="all" data-i18n="schedule.all">All events</option>
                    <option value="ceremony" data-i18n="schedule.ceremony">Ceremonies</option>
                    <option value="coding" data-i18n="schedule.coding">Coding</option>
                    <option value="workshop" data-i18n="schedule.workshop">Workshops</option>
                    <option value="deadline" data-i18n="schedule.deadline">Deadlines</option>
                </select>
            </div>
            <p class="col-sm-6 col-md-8 mb-1 text-sm-end" id="scheduleCount" aria-live="polite"></p>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover align-middle">
                <thead class="table-dark"><tr><th scope="col" data-i18n="schedule.time">Time</th><th scope="col" data-i18n="schedule.event">Event</th><th scope="col" data-i18n="schedule.location">Location</th><th scope="col" data-i18n="schedule.type">Type</th></tr></thead>
                <tbody id="scheduleRows"></tbody>
            </table>
        </div>
        <p class="alert alert-light border" id="scheduleEmpty" hidden data-i18n="schedule.empty">No events are listed in this category.</p>
    </main>

    <footer class="site-footer text-center py-3"><p class="mb-0" data-i18n="footer.rights">© 2026 CodeRun Hackathon. All rights reserved.</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="jquery-interactions.js"></script>
    <script src="app.js"></script>
    <script type="module" src="js/final.js"></script>
</body>
</html>
