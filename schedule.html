<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="See the CodeRun Hackathon weekend schedule and filter events by type.">
    <title>CodeRun Hackathon - Schedule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">CodeRun</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="schedule.html">Schedule</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item ms-lg-3"><button class="btn btn-outline-light btn-sm theme-toggle" id="themeToggle" type="button">Dark mode</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="mb-2">Event schedule</h1>
        <p class="text-muted mb-4">The event runs from Friday evening through Sunday awards.</p>
        <div class="row g-3 align-items-end mb-3">
            <div class="col-sm-6 col-md-4">
                <label class="form-label" for="scheduleFilter">Show event type</label>
                <select class="form-select" id="scheduleFilter">
                    <option value="all">All events</option>
                    <option value="ceremony">Ceremonies</option>
                    <option value="coding">Coding</option>
                    <option value="workshop">Workshops</option>
                    <option value="deadline">Deadlines</option>
                </select>
            </div>
            <p class="col-sm-6 col-md-8 mb-1 text-sm-end" id="scheduleCount" aria-live="polite"></p>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr><th scope="col">Time</th><th scope="col">Event</th><th scope="col">Location</th><th scope="col">Type</th></tr>
                </thead>
                <tbody id="scheduleRows"></tbody>
            </table>
        </div>
        <p class="alert alert-light border" id="scheduleEmpty" hidden>No events are listed in this category.</p>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p>&copy; 2026 CodeRun Hackathon. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="jquery-interactions.js"></script>
    <script src="app.js"></script>
</body>
</html>
